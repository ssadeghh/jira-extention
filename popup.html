<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>تنظیمات سریع</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; width: 360px; }
    h3 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; font-size: 12px; margin: 10px 0 4px; }
    input[type="text"], input[type="number"] {
      width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid #ccc;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hint { color: #777; font-size: 11px; margin-top: 2px; }
    .btns { display: flex; gap: 8px; margin-top: 12px; }
    button { padding: 8px 10px; border-radius: 8px; border: 1px solid #999; cursor: pointer; }
    button.primary { background: #0a84ff; color: #fff; border-color: #0a84ff; }
    #status { font-size: 12px; margin-top: 8px; min-height: 16px; }
    .sep { height: 1px; background: #ddd; margin: 10px 0; }
  </style>
</head>
<body>
  <h3>تنظیمات سریع افزونه</h3>

  <label>آدرس JIRA (origin)</label>
  <input id="jiraOrigin" type="text" placeholder="https://jira.example.com" />

  <label>الگوی مسیر JIRA (glob)</label>
  <input id="jiraPathGlob" type="text" value="/secure/*" />
  <div class="hint">مثال: /secure/* یا /issues/* (با origin ترکیب می‌شود)</div>

  <div class="row">
    <div>
      <label>Polling بک‌گراند (دقیقه)</label>
      <input id="pollMinutes" type="number" min="1" step="1" />
      <div class="hint">آلارم کروم کمتر از ۱ دقیقه اجازه نمی‌دهد</div>
    </div>
    <div>
      <label>رفرش صفحهٔ JIRA (ms)</label>
      <input id="pageAutoRefreshMs" type="number" min="0" step="1000" />
      <div class="hint">۰ یعنی خاموش (داخل خود صفحه)</div>
    </div>
  </div>

  <div class="row">
    <div>
      <label>واچ‌داگ بک‌گراند (ms)</label>
      <input id="bgWatchdogMs" type="number" min="0" step="1000" />
    </div>
    <div>
      <label>فاصلهٔ ارسال به SPlus (ms)</label>
      <input id="sendGapMs" type="number" min="200" step="100" />
    </div>
  </div>

  <label>SPlus Chat URL</label>
  <input id="splusUrl" type="text" placeholder="https://web.splus.ir/#45913396" />

  <label>عنوان پیام</label>
  <input id="messageHeader" type="text" placeholder="incident جدید اضافه شد" />

  <div class="sep"></div>

  <div class="btns">
    <button id="openOptions">تنظیمات کامل…</button>
    <button id="save" class="primary">ذخیره و اعمال</button>
  </div>

  <div id="status" class="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
